[package]
name = "token-view-mobile"
version = "0.3.3"
description = "Token View for Android: reads the PC's synced usage snapshot"
edition = "2021"

[lib]
name = "token_view_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-google-auth = { path = "../plugin-google-auth" }
tauri-plugin-apk-update = { path = "../plugin-apk-update", optional = true }
tauri-plugin-limits-widget = { path = "../plugin-limits-widget" }

[features]
# The sideloaded APK updates itself from GitHub Releases. The Google Play build
# leaves this off: Play apps may only be updated by Play, and without the plugin
# the app does not request REQUEST_INSTALL_PACKAGES.
github-updates = ["dep:tauri-plugin-apk-update"]

[profile.release]
opt-level = "s"
lto = true
strip = true
