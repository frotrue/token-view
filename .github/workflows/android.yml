name: Android

# Builds the signed phone app (mobile/) in two flavors:
# - github: the sideloaded APK that updates itself from GitHub Releases. Pull
#   requests get it as an artifact; a version tag also attaches it to the release.
# - play: the Google Play bundle (AAB) without the self-updater, signed with the
#   same key, which Play uses as the upload key. Uploaded to Play Console by hand.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: ${{ matrix.flavor == 'play' && 'aab' || 'apk' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [github, play]
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
          key: ${{ matrix.flavor }}

      - run: npm ci

      - name: Generate the Android project
        working-directory: mobile
        run: |
          npm run tauri -- android init --ci
          npm run tauri -- icon src-tauri/icons/icon.png

      - name: Release signing
        working-directory: mobile
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/token-view.jks"
          python3 ci/configure_signing.py "$RUNNER_TEMP/token-view.jks" "$PASSWORD"

      - name: Build APK
        if: matrix.flavor == 'github'
        working-directory: mobile
        run: |
          code=$(node ci/version_code.mjs)
          npm run tauri -- android build --apk --target aarch64 --ci --features github-updates --config "{\"bundle\":{\"android\":{\"versionCode\":$code}}}"

      - name: Build AAB
        if: matrix.flavor == 'play'
        working-directory: mobile
        env:
          VITE_DISTRIBUTION: play
        run: |
          code=$(node ci/version_code.mjs)
          npm run tauri -- android build --aab --target aarch64 --ci --config "{\"bundle\":{\"android\":{\"versionCode\":$code}}}"

      - name: Collect the build
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          outputs=mobile/src-tauri/gen/android/app/build/outputs
          if [ "${{ matrix.flavor }}" = play ]; then
            src=$(find "$outputs/bundle" -name '*release*.aab' | head -n1)
            dest="out/Token.View_${version}_play.aab"
          else
            src=$(find "$outputs/apk" -name '*release*.apk' | head -n1)
            dest="out/Token.View_${version}_android-arm64.apk"
          fi
          test -n "$src"
          mkdir -p out
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: No self-update permission in the Play build
        if: matrix.flavor == 'play'
        run: |
          manifests=$(find mobile/src-tauri/gen/android/app/build/intermediates -ipath '*merged_manifest*release*' -name AndroidManifest.xml)
          test -n "$manifests"
          if grep -l REQUEST_INSTALL_PACKAGES $manifests; then
            echo "::error::the Play build must not request REQUEST_INSTALL_PACKAGES"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor == 'play' && 'token-view-play' || 'token-view-android' }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      - name: Attach to the release
        if: matrix.flavor == 'github' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The desktop workflow creates the release; wait for it (up to ~25 min).
          for i in $(seq 1 50); do
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber
